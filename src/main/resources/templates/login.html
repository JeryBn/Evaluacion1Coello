<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingreso | Historia Clinica</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><h1>Historia Clinica</h1><main class="contenedor"><h2>Iniciar sesion</h2>
<p th:if="${param.error}" role="alert">Usuario o clave incorrectos, o cuenta inactiva.</p><p th:if="${param.logout}">Sesion cerrada.</p>
<form th:action="@{/login}" method="post"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required><label for="password">Contrasena</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Ingresar</button></form></main></body></html>
