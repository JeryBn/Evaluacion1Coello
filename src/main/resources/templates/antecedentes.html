<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antecedentes y alergias</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navegacion :: flujo}"></div>
<main class="contenedor">
    <h1>Antecedentes y alergias</h1>
    <p th:text="'Historia clinica ID: ' + ${historiaId}"></p>
    <section class="dato">
        <h2>Registrar antecedente</h2>
        <form th:action="@{/historias-clinicas/{id}/antecedentes(id=${historiaId})}" method="post">
            <label>Tipo
                <select name="tipo" required><option value="PERSONAL">Personal</option><option value="FAMILIAR">Familiar</option></select>
            </label>
            <label>Descripcion <textarea name="descripcion" required></textarea></label>
            <label>Fecha de registro <input type="date" name="fechaRegistro" required></label>
            <button type="submit">Guardar antecedente</button>
        </form>
    </section>
    <section class="dato">
        <h2>Registrar alergia</h2>
        <form th:action="@{/historias-clinicas/{id}/alergias(id=${historiaId})}" method="post">
            <label>Alergia <input name="alergia" required></label>
            <label>Tipo <input name="tipo" required></label>
            <label>Reaccion <textarea name="reaccion" required></textarea></label>
            <label>Observacion <textarea name="observacion"></textarea></label>
            <label>Fecha de registro <input type="date" name="fechaRegistro" required></label>
            <button type="submit">Guardar alergia</button>
        </form>
    </section>
    <section><h2>Antecedentes registrados</h2>
    <div th:each="item : ${antecedentes}">
        <p th:text="${item.descripcion}"></p>
        <details><summary>Editar</summary><form th:action="@{/historias-clinicas/{h}/antecedentes/{id}/editar(h=${historiaId},id=${item.id})}" method="post">
            <label>tipo<input name="tipo" th:value="${item.tipo}" type="text" required maxlength="255"></label>
            <label>descripcion<input name="descripcion" th:value="${item.descripcion}" type="text" required maxlength="255"></label>
            <label>fechaRegistro<input name="fechaRegistro" th:value="${item.fechaRegistro}" type="date" required maxlength="255"></label>
            <button>Guardar</button></form></details>
        <form th:action="@{/historias-clinicas/{h}/antecedentes/{id}/eliminar(h=${historiaId},id=${item.id})}" method="post" onsubmit="return confirm('Eliminar este registro?')"><button>Eliminar</button></form>
    </div></section>
    <section><h2>Alergias registrados</h2>
    <div th:each="item : ${alergias}">
        <p th:text="${item.alergia}"></p>
        <details><summary>Editar</summary><form th:action="@{/historias-clinicas/{h}/alergias/{id}/editar(h=${historiaId},id=${item.id})}" method="post">
            <label>alergia<input name="alergia" th:value="${item.alergia}" type="text" required maxlength="255"></label>
            <label>tipo<input name="tipo" th:value="${item.tipo}" type="text" required maxlength="255"></label>
            <label>reaccion<input name="reaccion" th:value="${item.reaccion}" type="text" required maxlength="255"></label>
            <label>observacion<input name="observacion" th:value="${item.observacion}" type="text"  maxlength="255"></label>
            <label>fechaRegistro<input name="fechaRegistro" th:value="${item.fechaRegistro}" type="date" required maxlength="255"></label>
            <button>Guardar</button></form></details>
        <form th:action="@{/historias-clinicas/{h}/alergias/{id}/eliminar(h=${historiaId},id=${item.id})}" method="post" onsubmit="return confirm('Eliminar este registro?')"><button>Eliminar</button></form>
    </div></section>
    <a class="enlace-volver" th:href="@{/historias-clinicas}">Volver al listado</a>
    <a class="enlace-siguiente" th:href="@{/atencion-medica}">Continuar a atención médica</a>
</main>
</body>
</html>
