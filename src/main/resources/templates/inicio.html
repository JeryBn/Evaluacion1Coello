<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Clinica</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div th:replace="~{fragments/navegacion :: flujo}"></div>
<main class="contenedor">
    <h1>Historia Clinica</h1>
    <p>Selecciona el modulo con el que deseas trabajar.</p>
    <p sec:authorize="hasAnyRole('ADMINISTRADOR','MEDICO','RECEPCIONISTA')"><a th:href="@{/pacientes}">Pacientes</a></p>
    <p sec:authorize="hasAnyRole('ADMINISTRADOR','MEDICO')"><a th:href="@{/historias-clinicas}">Historias clinicas y atenciones iniciales</a></p>
    <p sec:authorize="hasAnyRole('ADMINISTRADOR','MEDICO')"><a th:href="@{/atencion-medica}">Atencion medica</a></p>
    <p sec:authorize="hasRole('ADMINISTRADOR')"><a th:href="@{/admin/usuarios}">Usuarios</a> | <a th:href="@{/admin/roles}">Roles</a> | <a th:href="@{/auditoria}">Auditoria</a></p>
</main>
</body>
</html>
